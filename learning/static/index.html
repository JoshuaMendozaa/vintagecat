<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vintagecat</title>
</head>

<script>
    const uploadForm = document.getElementById("upload-form");
    const inventory = document.getElementById("inventory");
    const loadButton = document.getElementById("load-items");
    loadButton.addEventListener("click", loadItems);

    uploadForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const photos = document.getElementById("garment-photos").files;
        const uploadStatus = document.getElementById("upload-status");

        if (photos.length === 0) {
            uploadStatus.textContent = "Choose at least one photo.";
            return;
        }

        const response = await fetch("/items", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({title: "Untitled garment"}),
        });

        if (!response.ok) {
            uploadStatus.textContent = "Could not create garment.";
            return;
        }

        const item = await response.json();

        for (const photo of photos) {
            const formData = new FormData();
            formData.append("photo", photo);

            const photoResponse = await fetch(`/items/${item.id}/photos`, {
                method: "POST",
                body: formData,
            });

            if (!photoResponse.ok) {
                uploadStatus.textContent = "Could not upload photo.";
                return;
            }
        }

        uploadStatus.textContent = "Photos uploaded.";
        await loadItems();
    });

    async function loadItems() {
        const response = await fetch("/items");

        if (!response.ok) {
            inventory.textContent = "Could not load inventory.";
            return;
        }

        const items = await response.json();
        inventory.replaceChildren();

        items.forEach(item => {
            const listItem = document.createElement("li");
            listItem.textContent = item.title;
            inventory.appendChild(listItem);
        });
    }
</script>

<body>
    <h1>Vintagecat</h1>
    <form id="upload-form">
        <label for="garment-photos">Garment photos, tags, and condition details</label>
        <input id="garment-photos" type="file" accept="image/*" multiple required>
        <button type="submit">Upload garment</button>
    </form>
    <p id="upload-status" role="status"></p>
    <p id="create-status" role="status"></p>
    <button id="load-items">Load inventory</button>
    <ul id="inventory"></ul>
</body>
</html>
